# Fonte única para os pacotes .deb (Debian/Ubuntu) e .rpm (Fedora/RHEL/openSUSE).
# Construído pelo GitHub Actions (.github/workflows/packages.yml) com o nfpm.
# O workflow monta ./stage/ com o zip do release do 64Gram antes de rodar o nfpm.
name: "64gram"
arch: "amd64"
platform: "linux"
version: "1.2.10"
section: "net"
priority: "optional"
maintainer: "LucianoSkx"
description: |
  Unofficial desktop version of Telegram messaging app.
  Repackaged from the official 64Gram Linux release.
vendor: "64Gram"
homepage: "https://github.com/TDesktop-x64/tdesktop"
license: "GPL-3.0"

contents:
  - src: ./stage/Telegram
    dst: /opt/64gram/Telegram
    file_info:
      mode: 0755

  - src: ./stage/Updater
    dst: /opt/64gram/Updater
    file_info:
      mode: 0755

  # desativa o atualizador interno: quem atualiza é o gerenciador de pacotes
  - src: ./stage/externalupdater.d/telegram-desktop.conf
    dst: /opt/64gram/externalupdater.d/telegram-desktop.conf

  - src: ./stage/usr/share/applications/io.github.tdesktop_x64.TDesktop.desktop
    dst: /usr/share/applications/io.github.tdesktop_x64.TDesktop.desktop
    file_info:
      mode: 0644

  - src: /opt/64gram/Telegram
    dst: /usr/bin/64gram
    type: symlink

  - src: ./stage/usr/share/icons/hicolor/16x16/apps/64gram.png
    dst: /usr/share/icons/hicolor/16x16/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/32x32/apps/64gram.png
    dst: /usr/share/icons/hicolor/32x32/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/48x48/apps/64gram.png
    dst: /usr/share/icons/hicolor/48x48/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/64x64/apps/64gram.png
    dst: /usr/share/icons/hicolor/64x64/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/128x128/apps/64gram.png
    dst: /usr/share/icons/hicolor/128x128/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/256x256/apps/64gram.png
    dst: /usr/share/icons/hicolor/256x256/apps/64gram.png
    file_info:
      mode: 0644

  - src: ./stage/usr/share/icons/hicolor/512x512/apps/64gram.png
    dst: /usr/share/icons/hicolor/512x512/apps/64gram.png
    file_info:
      mode: 0644

# Dependências verificadas com ldd no binário do release. O glibc é implícito
# (nfpm não suporta versioná-lo).
overrides:
  deb:
    depends:
      - libglib2.0-0
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libcairo2
      - libharfbuzz0b
      - libfreetype6
      - libfontconfig1
      - libx11-6
      - libxcb1
      - libxext6
      - libxrender1
      - libdbus-1-3
      - libsystemd0
  rpm:
    depends:
      - glib2
      - pango
      - cairo
      - harfbuzz
      - freetype2
      - fontconfig
      - libX11
      - libxcb
      - libXext
      - libXrender
      - dbus-libs
      - systemd-libs

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh
